name: Publicar Circuitos Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html app.js styles.css .nojekyll _site/

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

