<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7f4" />
  <title>Circuitos Lab — aprende haciendo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16h6l3-8 6 16 3-8h6"/><circle cx="4" cy="16" r="2"/><circle cx="28" cy="16" r="2"/></svg></span><span>Circuitos<span class="brand-light">Lab</span><small>APRENDE · SIMULA · RESUELVE</small></span></div>
      <div class="side-label">TU ESPACIO</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>Inicio</span></button>
        <button class="nav-item" data-view="simulator"><span class="nav-icon">⌁</span><span>Simulador</span><span class="nav-pill">DC</span></button>
        <button class="nav-item" data-view="learn"><span class="nav-icon">▤</span><span>Aprender</span></button>
        <button class="nav-item" data-view="exams"><span class="nav-icon">◷</span><span>Exámenes</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="side-label">TU PROGRESO</div>
      <div class="side-progress"><div class="side-progress-row"><span>Ruta de aprendizaje</span><b id="side-progress-label">0%</b></div><div class="progress-track"><i id="side-progress-bar" style="width:0%"></i></div><span class="muted small" id="side-progress-meta">0 de 8 capítulos</span></div>
      <button class="continue-mini" data-view="learn"><span class="mini-icon">↗</span><span><b>Seguir aprendiendo</b><small>Retoma donde te quedaste</small></span><span class="mini-arrow">›</span></button>
      <div class="sidebar-bottom"><div class="avatar">JR</div><div class="profile-copy"><b>Estudiante</b><span>Modo de práctica</span></div><button class="more-btn" aria-label="Más opciones">···</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>Mi espacio</span><span class="crumb-slash">/</span><b id="crumb-current">Inicio</b></div><div class="top-actions"><span class="today-label" id="today-label"></span><span class="top-divider"></span><button class="icon-btn" title="Ayuda" data-action="show-help">?<span class="sr-only">Ayuda</span></button><div class="top-avatar">JR</div></div></header>
      <div id="app-content" class="page-content"></div>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
